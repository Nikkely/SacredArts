[workspace]
resolver = "3"
members = [
    "crates/sacredarts-core",
    "crates/sacredarts-policy",
    "crates/sacredarts-runner",
    "crates/sacredarts-tracer",
    "crates/sacredarts-guide",
    "crates/sacredarts-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sacredarts-core = { path = "crates/sacredarts-core" }
sacredarts-policy = { path = "crates/sacredarts-policy" }
sacredarts-guide = { path = "crates/sacredarts-guide" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
strum = { version = "0.28", features = ["derive"] }

[workspace.lints.clippy]
# CI runs clippy with -D warnings. On top of the default set we use the
# whole `pedantic` group (incl. must_use, documented error/panic conditions,
# checked numeric casts, short functions); only `doc_markdown` is off because
# it also flags plain words such as the project name.
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 4
