[package]
name = "sacredarts-mcp"
description = "SacredArts MCP server: AI-powered Linux system call laboratory"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sacredarts"
path = "src/main.rs"

[dependencies]
sacredarts-core.workspace = true
strum.workspace = true
sacredarts-guide.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
libc.workspace = true
rmcp = { version = "3.11", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "time", "sync", "signal"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Acceptance tests (spec §12) live in the repository-level tests/integration.
[[test]]
name = "acceptance"
path = "../../tests/integration/acceptance.rs"

[lints]
workspace = true
